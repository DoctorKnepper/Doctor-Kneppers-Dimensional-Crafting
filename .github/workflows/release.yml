name: Release

# Runs when you publish a GitHub release. Builds the jar, attaches it to the release,
# and uploads it to Modrinth and CurseForge (see "Releasing" in the README for the settings it needs).
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Publish to Modrinth
        if: vars.MODRINTH_ID != ''
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/!(*-@(dev|sources|javadoc)).jar
          name: Doctor Knepper's Dimensional Crafting Table ${{ github.event.release.tag_name }}
          loaders: fabric
          game-versions: 26.3
          java: 25
          dependencies: |
            fabric-api(required)

      - name: Publish to CurseForge
        if: vars.CURSEFORGE_ID != ''
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/!(*-@(dev|sources|javadoc)).jar
          name: Doctor Knepper's Dimensional Crafting Table ${{ github.event.release.tag_name }}
          loaders: fabric
          game-versions: 26.3
          java: 25
          dependencies: |
            fabric-api(required)

      - name: Attach the jar to the GitHub release
        uses: Kira-NT/mc-publish@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: build/libs/!(*-@(dev|sources|javadoc)).jar
          name: Doctor Knepper's Dimensional Crafting Table ${{ github.event.release.tag_name }}
          loaders: fabric
          game-versions: 26.3
          java: 25
          dependencies: |
            fabric-api(required)
